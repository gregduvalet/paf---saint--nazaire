<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>PAF — Saint-Nazaire</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#0a0a12; }

    /* ── Layout général ─────────────────────────────────── */
    #cesiumContainer {
      position:absolute; left:300px; right:0; top:0; bottom:0;
    }

    /* ── Panneau gauche — liste POI ─────────────────────── */
    #leftPanel {
      position:absolute; left:0; top:0; bottom:0; width:300px;
      background:#0f1117; border-right:1px solid #1e2235;
      display:flex; flex-direction:column; z-index:10;
    }
    #leftHeader {
      padding:16px 14px 10px;
      background:#131620;
      border-bottom:1px solid #1e2235;
      flex-shrink:0;
    }
    #leftHeader h1 { color:#90caf9; font-size:15px; font-weight:700; margin-bottom:4px; }
    #leftHeader p  { color:#556; font-size:11px; }
    #searchBox {
      margin:10px 12px 0;
      padding:7px 10px;
      background:#1a1e2e; border:1px solid #2a3050; border-radius:6px;
      color:#ccc; font-size:12px; width:calc(100% - 24px); outline:none;
    }
    #searchBox::placeholder { color:#445; }
    #poiList {
      flex:1; overflow-y:auto; padding:8px 8px;
    }
    #poiList::-webkit-scrollbar { width:5px; }
    #poiList::-webkit-scrollbar-track { background:#0f1117; }
    #poiList::-webkit-scrollbar-thumb { background:#2a3050; border-radius:3px; }

    .poi-card {
      display:flex; align-items:center; gap:10px;
      padding:9px 10px; border-radius:8px; cursor:pointer;
      border:1px solid transparent; margin-bottom:4px;
      transition:all .18s;
    }
    .poi-card:hover  { background:#151929; border-color:#2a3a60; }
    .poi-card.active { background:#0d2040; border-color:#42a5f5; }
    .poi-card img {
      width:70px; height:52px; border-radius:5px; object-fit:cover;
      flex-shrink:0; border:1px solid #1e2235;
    }
    .poi-card-info { flex:1; min-width:0; }
    .poi-card-name  { color:#dde; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .poi-card-desc  { color:#778; font-size:11px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── Panneau droit — fiche info ─────────────────────── */
    #rightPanel {
      position:absolute; right:-360px; top:0; bottom:0; width:360px;
      background:#0f1117; border-left:1px solid #1e2235;
      z-index:10; display:flex; flex-direction:column;
      transition:right .3s cubic-bezier(.4,0,.2,1);
      overflow:hidden;
    }
    #rightPanel.open { right:0; }

    #closeBtn {
      position:absolute; top:10px; right:10px;
      background:#1a1e2e; border:1px solid #2a3050; border-radius:50%;
      color:#aaa; width:28px; height:28px; font-size:14px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      z-index:1;
    }
    #closeBtn:hover { background:#2a3050; color:#fff; }
    #cardScroll { flex:1; overflow-y:auto; }
    #cardScroll::-webkit-scrollbar { width:5px; }
    #cardScroll::-webkit-scrollbar-track { background:#0f1117; }
    #cardScroll::-webkit-scrollbar-thumb { background:#2a3050; border-radius:3px; }

    #cardImg {
      width:100%; height:200px; object-fit:cover;
      display:block; background:#1a1e2e;
    }
    #cardBody { padding:16px 16px 24px; }
    #cardTitle { color:#eef; font-size:17px; font-weight:700; line-height:1.3; margin-bottom:10px; }
    #cardDesc  { color:#99a; font-size:13px; line-height:1.65; }
    #cardMedia { margin-top:16px; display:flex; flex-direction:column; gap:12px; }
    #cardYoutube iframe {
      width:100%; border-radius:8px; border:none; display:block;
    }
    #cardAudioWrap {
      display:none;
      background:#151929; border-radius:8px; padding:12px;
    }
    #cardAudioWrap .audio-label { color:#778; font-size:11px; margin-bottom:8px; display:block; }
    .audio-controls {
      display:flex; align-items:center; gap:8px;
    }
    .audio-btn {
      background:#1e2a45; border:1px solid #2a3a60; border-radius:6px;
      color:#90caf9; font-size:15px; width:34px; height:34px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:background .15s;
    }
    .audio-btn:hover { background:#2a3a60; }
    .audio-btn.stop-btn { color:#ef9a9a; }
    .audio-progress-wrap { flex:1; display:flex; flex-direction:column; gap:4px; }
    #audioProgress {
      width:100%; height:4px; accent-color:#42a5f5; cursor:pointer;
    }
    #audioTime { color:#556; font-size:10px; font-family:monospace; text-align:right; }

    /* ── Status ─────────────────────────────────────────── */
    #status {
      position:absolute; bottom:30px; left:310px;
      background:rgba(8,10,18,.8); color:#778;
      font-size:11px; font-family:monospace;
      padding:5px 10px; border-radius:6px; z-index:5;
    }
    #orbitBadge {
      display:none;
      position:absolute; bottom:30px; right:10px;
      background:rgba(21,101,192,.9); color:#fff;
      font-size:12px; font-family:Arial,sans-serif;
      padding:6px 14px; border-radius:20px; z-index:10;
      cursor:pointer; border:1px solid #42a5f5;
      transition:opacity .2s;
    }
    #orbitBadge:hover { background:rgba(198,40,40,.9); border-color:#ef9a9a; }
  </style>
</head>
<body>

<!-- Panneau gauche -->
<div id="leftPanel">
  <div id="leftHeader">
    <h1>📍 Points d'intérêt</h1>
    <p id="poiCount">Chargement...</p>
    <input id="searchBox" type="text" placeholder="Rechercher un lieu..." oninput="filterPOIs(this.value)">
  </div>
  <div id="poiList"></div>
</div>

<!-- Carte Cesium -->
<div id="cesiumContainer"></div>

<!-- Panneau droit -->
<div id="rightPanel">
  <button id="closeBtn" onclick="closeCard()">✕</button>
  <div id="cardScroll">
    <img id="cardImg" src="" alt="">
    <div id="cardBody">
      <h2 id="cardTitle"></h2>
      <p id="cardDesc"></p>
      <div id="cardMedia">
        <div id="cardYoutube"></div>
        <div id="cardAudioWrap">
          <span class="audio-label">🔊 Audio</span>
          <div class="audio-controls">
            <button class="audio-btn" id="playPauseBtn" onclick="toggleAudio()" title="Lecture / Pause">▶</button>
            <button class="audio-btn stop-btn" onclick="stopAudio()" title="Stop">⏹</button>
            <div class="audio-progress-wrap">
              <input type="range" id="audioProgress" value="0" min="0" step="0.1" oninput="seekAudio(this.value)">
              <span id="audioTime">0:00 / 0:00</span>
            </div>
          </div>
          <audio id="cardAudio"></audio>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="status">⏳ Chargement...</div>
<div id="orbitBadge" onclick="stopOrbit()">⟳ Rotation — cliquer pour arrêter</div>

<script>
// ════════════════════════════════════════════════════════════
//  ① CONFIGURATION
// ════════════════════════════════════════════════════════════
const TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5Y2ZiMmE2MC0xMzFiLTRjYTAtOTlmMC01MTU1N2Y5MWU3M2UiLCJpZCI6NDQwODA5LCJzdWIiOiJHcmVnMlNOIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6InRva2VuIG5laWZseSBhbmQgZ2l0aHViIiwiaWF0IjoxNzgxNTE4Mjg2fQ.BxX81XtjWoWPqRzq6FL61vgVbXvFDw_dnR1nx1poU4o';  // remplacé sur GitHub

const MARKER_HEIGHT = 75;

// Palette de couleurs pour les marqueurs (cycle automatique)
const PALETTE = [
  Cesium.Color.DODGERBLUE, Cesium.Color.LIMEGREEN, Cesium.Color.VIOLET,
  Cesium.Color.ORANGE,     Cesium.Color.CYAN,      Cesium.Color.YELLOW,
  Cesium.Color.HOTPINK,    Cesium.Color.AQUAMARINE, Cesium.Color.TOMATO,
  Cesium.Color.GOLD,       Cesium.Color.MEDIUMPURPLE, Cesium.Color.SPRINGGREEN,
  Cesium.Color.DEEPSKYBLUE, Cesium.Color.CORAL
];

// Tableau des POI — chargé dynamiquement depuis pois/
var POIS = [];

// ════════════════════════════════════════════════════════════
//  ② INIT CESIUM
// ════════════════════════════════════════════════════════════
Cesium.Ion.defaultAccessToken = TOKEN;

const viewer = new Cesium.Viewer('cesiumContainer', {
  terrain: Cesium.Terrain.fromWorldTerrain(),
  baseLayerPicker: false, navigationHelpButton: false,
  sceneModePicker: false, homeButton: false, geocoder: false,
  animation: false, timeline: false, fullscreenButton: false, infoBox: false,
  selectionIndicator: false
});
viewer.scene.globe.enableLighting = true;

// Vue initiale sur Saint-Nazaire
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(-2.21, 47.27, 4000),
  orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 }
});

// ════════════════════════════════════════════════════════════
//  ③ CHARGEMENT DES POI DEPUIS GITHUB (chemins relatifs)
// ════════════════════════════════════════════════════════════
async function fetchPOIs() {
  setStatus('⏳ Chargement des POI...');
  try {
    var indexResp = await fetch('./pois/index.json');
    var index = await indexResp.json();

    var configs = (await Promise.all(
  index.map(function(item) {
    return fetch('./pois/' + item.id + '/config.json')
      .then(function(r) { return r.json(); })
      .catch(function(e) {
        console.warn('POI ignoré (' + item.id + '):', e.message);
        return null;
      });
  })
)).filter(function(c) { return c !== null; });

    POIS = configs.map(function(cfg, i) {
      var base = './pois/' + cfg.id + '/';
      return {
        id:        cfg.id,
        name:      cfg.nom,
        lon:       cfg.lon,
        lat:       cfg.lat,
        color:     PALETTE[i % PALETTE.length],
        thumbnail: base + 'photo.jpg',
        modelUrl:  cfg.modele_3d ? base + cfg.modele_3d : null,
        card: {
          title:       cfg.nom,
          image:       base + 'photo.jpg',
          description: cfg.description || '',
          youtube:     cfg.youtube     || '',
          audio:       cfg.audio       ? base + cfg.audio : ''
        }
      };
    });

    // Recentrer la caméra sur le barycentre des POI
    if (POIS.length > 0) {
      var avgLon = POIS.reduce(function(s, p) { return s + p.lon; }, 0) / POIS.length;
      var avgLat = POIS.reduce(function(s, p) { return s + p.lat; }, 0) / POIS.length;
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(avgLon, avgLat, 4000),
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 }
      });
    }

    buildList();
    setStatus('✅ ' + POIS.length + ' POI chargés');

  } catch(e) {
    console.error('Erreur chargement POI:', e);
    setStatus('❌ Erreur chargement POI — ' + e.message);
  }
}

// ════════════════════════════════════════════════════════════
//  ④ GOOGLE 3D TILES
// ════════════════════════════════════════════════════════════
let _city = null;
(async function() {
  try {
    _city = await Cesium.Cesium3DTileset.fromIonAssetId(2275207);
    viewer.scene.primitives.add(_city);
    setStatus('✅ Carte 3D chargée');
  } catch(e) {
    console.warn('Google 3D Tiles:', e.message);
    setStatus('⚠️ Google 3D Tiles non disponible');
  }
  await fetchPOIs();
  await loadMarkers();
})();

// ════════════════════════════════════════════════════════════
//  ⑤ MARQUEURS POI (ligne verticale + icône à 75m)
// ════════════════════════════════════════════════════════════
const _tc = {};
function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

async function getH(lon, lat) {
  var k = lon.toFixed(4) + ',' + lat.toFixed(4);
  if (_tc[k] != null && _tc[k] > 0) return _tc[k];
  for (var attempt = 0; attempt < 4; attempt++) {
    if (attempt > 0) await sleep(600 * attempt);
    try {
      var r = await Cesium.sampleTerrainMostDetailed(
        viewer.terrainProvider, [Cesium.Cartographic.fromDegrees(lon, lat)]
      );
      var h = r[0].height;
      if (h != null && h > 0) { _tc[k] = h; return h; }
    } catch(e) {}
  }
  var camH = Cesium.Cartographic.fromCartesian(viewer.camera.position).height;
  var fallback = Math.max(10, camH - 500);
  _tc[k] = fallback;
  return fallback;
}

const pinBuilder = new Cesium.PinBuilder();
const _entities = {};

async function loadMarkers() {
  await sleep(1500);

  for (var i = 0; i < POIS.length; i++) {
    var poi   = POIS[i];
    var th    = await getH(poi.lon, poi.lat);
    var color = poi.color;
    var groundPos = Cesium.Cartesian3.fromDegrees(poi.lon, poi.lat, th + 3);
    var iconPos   = Cesium.Cartesian3.fromDegrees(poi.lon, poi.lat, th + MARKER_HEIGHT);

    // ── Ligne verticale ──────────────────────────────────
    var line = viewer.entities.add({
      polyline: {
        positions: [groundPos, iconPos],
        width: 2,
        material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.2, color: color.withAlpha(0.9) }),
        depthFailMaterial: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.2, color: color.withAlpha(0.4) }),
        clampToGround: false
      }
    });

    if (poi.modelUrl) {
      // ── Modèle GLB ──────────────────────────────────────
      try {
        var model = await Cesium.Model.fromGltfAsync({
          url: poi.modelUrl,
          modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(iconPos),
          scale: 5.0
        });
        viewer.scene.primitives.add(model);
        model._poiId = poi.id;
        _entities[poi.id] = { line: line, model: model };
      } catch(me) {
        console.warn('Modèle GLB non chargé pour ' + poi.name + ':', me.message);
        _placeBillboard(poi, line, iconPos, color);
      }
    } else {
      _placeBillboard(poi, line, iconPos, color);
    }
  }
  setStatus('✅ ' + POIS.length + ' marqueurs chargés');
}

function _placeBillboard(poi, line, iconPos, color) {
  var pinImg = pinBuilder.fromColor(color, 42);
  var iconEntity = viewer.entities.add({
    position: iconPos,
    billboard: {
      image: pinImg,
      width: 42, height: 42,
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      disableDepthTestDistance: Number.POSITIVE_INFINITY,
      scaleByDistance: new Cesium.NearFarScalar(500, 1.2, 5000, 0.6)
    },
    label: {
      text: poi.name,
      font: '11px Arial',
      fillColor: Cesium.Color.WHITE,
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 2,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      verticalOrigin: Cesium.VerticalOrigin.TOP,
      pixelOffset: new Cesium.Cartesian2(0, 4),
      disableDepthTestDistance: Number.POSITIVE_INFINITY,
      scaleByDistance: new Cesium.NearFarScalar(500, 1.0, 5000, 0.5),
      showBackground: true,
      backgroundColor: new Cesium.Color(0, 0, 0, 0.6),
      backgroundPadding: new Cesium.Cartesian2(4, 2)
    },
    _poiId: poi.id
  });
  _entities[poi.id] = { line: line, icon: iconEntity };
}

// ════════════════════════════════════════════════════════════
//  ⑥ PANNEAU GAUCHE — liste
// ════════════════════════════════════════════════════════════
var _activePOI = null;

function buildList(filter) {
  var list = document.getElementById('poiList');
  list.innerHTML = '';
  var f = (filter || '').toLowerCase();
  var shown = 0;
  POIS.forEach(function(poi) {
    if (f && poi.name.toLowerCase().indexOf(f) === -1) return;
    var div = document.createElement('div');
    div.className = 'poi-card' + (_activePOI === poi.id ? ' active' : '');
    div.id = 'card_' + poi.id;
    var desc = poi.card.description ? poi.card.description.substring(0, 55) + '…' : '';
    div.innerHTML =
      '<img src="' + poi.thumbnail + '" onerror="this.src=\'https://placehold.co/70x52/1a1e2e/556?text=?\'"/>' +
      '<div class="poi-card-info">' +
        '<div class="poi-card-name">' + poi.name + '</div>' +
        (desc ? '<div class="poi-card-desc">' + desc + '</div>' : '') +
      '</div>';
    div.onclick = (function(id) { return function() { selectPOI(id); }; })(poi.id);
    list.appendChild(div);
    shown++;
  });
  document.getElementById('poiCount').textContent = shown + ' lieu' + (shown > 1 ? 'x' : '');
}

function filterPOIs(val) { buildList(val); }

// ════════════════════════════════════════════════════════════
//  ⑦ SÉLECTION D'UN POI
// ════════════════════════════════════════════════════════════
async function selectPOI(id) {
  var poi = POIS.find(function(p) { return p.id === id; });
  if (!poi) return;

  if (_activePOI) {
    var old = document.getElementById('card_' + _activePOI);
    if (old) old.classList.remove('active');
  }
  _activePOI = id;
  var cur = document.getElementById('card_' + id);
  if (cur) { cur.classList.add('active'); cur.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  var th = await getH(poi.lon, poi.lat);
  stopOrbit();
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(poi.lon, poi.lat, th + 280),
    orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-35), roll: 0 },
    duration: 2.2,
    easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT,
    complete: function() { startOrbit(poi.lon, poi.lat, th); }
  });

  openCard(poi);
}

// ════════════════════════════════════════════════════════════
//  ⑧ FICHE INFO (panneau droit)
// ════════════════════════════════════════════════════════════
function openCard(poi) {
  var c = poi.card;
  document.getElementById('cardImg').src = c.image;
  document.getElementById('cardTitle').textContent = c.title;
  document.getElementById('cardDesc').textContent  = c.description;

  // YouTube
  var yt = document.getElementById('cardYoutube');
  if (c.youtube) {
    var vid = extractYoutubeId(c.youtube);
    if (vid) {
      yt.innerHTML =
        '<iframe height="210" style="width:100%;border-radius:8px;display:block;border:none"' +
        ' src="https://www.youtube-nocookie.com/embed/' + vid + '?rel=0&modestbranding=1"' +
        ' allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"' +
        ' allowfullscreen></iframe>';
    } else { yt.innerHTML = ''; }
  } else { yt.innerHTML = ''; }

  // Audio
  var audioWrap = document.getElementById('cardAudioWrap');
  var audioEl   = document.getElementById('cardAudio');
  stopAudio();
  if (c.audio) {
    audioEl.src = c.audio;
    audioWrap.style.display = 'block';
    setTimeout(function() {
      audioEl.play().then(function() {
        document.getElementById('playPauseBtn').textContent = '⏸';
      }).catch(function(e) { console.warn('Autoplay bloqué:', e.message); });
    }, 350);
  } else {
    audioEl.src = '';
    audioWrap.style.display = 'none';
  }

  document.getElementById('rightPanel').classList.add('open');
}

// ════════════════════════════════════════════════════════════
//  ⑨ ORBIT
// ════════════════════════════════════════════════════════════
var _orbitActive  = false;
var _orbitTick    = null;
var _orbitHandler = null;

function startOrbit(lon, lat, terrainH) {
  _orbitActive = true;
  var center  = Cesium.Cartesian3.fromDegrees(lon, lat, terrainH + 8);
  var heading = viewer.camera.heading;
  var pitch   = Cesium.Math.toRadians(-32);
  var range   = 280;
  var speed   = Cesium.Math.toRadians(0.06);

  _orbitTick = function() {
    if (!_orbitActive) return;
    heading += speed;
    viewer.camera.lookAt(center, new Cesium.HeadingPitchRange(heading, pitch, range));
  };
  viewer.scene.preRender.addEventListener(_orbitTick);
  document.getElementById('orbitBadge').style.display = 'block';

  _orbitHandler = new Cesium.ScreenSpaceEventHandler(viewer.canvas);
  _orbitHandler.setInputAction(stopOrbit, Cesium.ScreenSpaceEventType.LEFT_DOWN);
  _orbitHandler.setInputAction(stopOrbit, Cesium.ScreenSpaceEventType.RIGHT_DOWN);
  _orbitHandler.setInputAction(stopOrbit, Cesium.ScreenSpaceEventType.MIDDLE_DOWN);
  _orbitHandler.setInputAction(stopOrbit, Cesium.ScreenSpaceEventType.WHEEL);
  _orbitHandler.setInputAction(stopOrbit, Cesium.ScreenSpaceEventType.PINCH_START);
}

function stopOrbit() {
  if (!_orbitActive) return;
  _orbitActive = false;
  if (_orbitTick)    { viewer.scene.preRender.removeEventListener(_orbitTick); _orbitTick = null; }
  if (_orbitHandler) { _orbitHandler.destroy(); _orbitHandler = null; }
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  document.getElementById('orbitBadge').style.display = 'none';
}

// ── Contrôles audio ──────────────────────────────────────────
function toggleAudio() {
  var a = document.getElementById('cardAudio');
  if (a.paused) { a.play(); document.getElementById('playPauseBtn').textContent = '⏸'; }
  else          { a.pause(); document.getElementById('playPauseBtn').textContent = '▶'; }
}
function stopAudio() {
  var a = document.getElementById('cardAudio');
  a.pause(); a.currentTime = 0;
  document.getElementById('playPauseBtn').textContent = '▶';
  document.getElementById('audioProgress').value = 0;
  document.getElementById('audioTime').textContent = '0:00 / 0:00';
}
function seekAudio(val) { document.getElementById('cardAudio').currentTime = val; }
function fmtTime(s) { var m = Math.floor(s/60); return m+':'+('0'+Math.floor(s%60)).slice(-2); }

document.getElementById('cardAudio').addEventListener('timeupdate', function() {
  var a = this;
  if (!a.duration) return;
  document.getElementById('audioProgress').max   = a.duration;
  document.getElementById('audioProgress').value = a.currentTime;
  document.getElementById('audioTime').textContent = fmtTime(a.currentTime) + ' / ' + fmtTime(a.duration);
});
document.getElementById('cardAudio').addEventListener('ended', function() {
  document.getElementById('playPauseBtn').textContent = '▶';
  document.getElementById('audioProgress').value = 0;
});

function closeCard() {
  document.getElementById('rightPanel').classList.remove('open');
  stopOrbit(); stopAudio();
  if (_activePOI) {
    var el = document.getElementById('card_' + _activePOI);
    if (el) el.classList.remove('active');
    _activePOI = null;
  }
}

function extractYoutubeId(url) {
  var m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

// ── Clic sur marqueur dans la scène ──────────────────────────
var handler = new Cesium.ScreenSpaceEventHandler(viewer.canvas);
handler.setInputAction(function(click) {
  var picked = viewer.scene.pick(click.position);
  if (picked && picked.id && picked.id._poiId) {
    selectPOI(picked.id._poiId);
  }
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

// ── Utilitaires ──────────────────────────────────────────────
function setStatus(msg) { document.getElementById('status').textContent = msg; }
</script>
